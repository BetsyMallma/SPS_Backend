spring.config.import=optional:file:.env[.properties]
spring.application.name=sps-backend

# Conexion a PostgreSQL - los datos se leen del archivo .env
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sps_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate: crea/actualiza tablas automaticamente al arrancar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto del servidor (el mismo que usa el Frontend)
server.port=8000

# Swagger UI disponible en /docs
springdoc.swagger-ui.path=/docs
